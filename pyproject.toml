[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapit-client"
version = "0.4.0"
description = "Read-only MAPIT client and MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<2.3",
    "pydantic>=2.11,<3",
    "PyJWT[crypto]>=2.10.1,<3",
    "cryptography>=43",
    "starlette>=0.27,<2",
]

[project.scripts]
mapit-mcp = "mapit.mcp_server:main"
mapit-history = "mapit.history_cli:main"
mapit-health = "mapit.health:main"

[project.optional-dependencies]
test = ["pytest>=9.1.1,<10", "httpx2>=2.5,<3"]
windows-auth = ["keyring>=25.6,<26; sys_platform == 'win32'"]
realtime = ["websockets>=15,<17"]
agent = ["openai-agents==0.22.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
