[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapit-client"
version = "0.2.0"
description = "Read-only MAPIT client and MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<2.3",
    "pydantic>=2.11,<3",
]

[project.scripts]
mapit-mcp = "mapit.mcp_server:main"

[project.optional-dependencies]
test = ["pytest>=8,<9"]
windows-auth = ["keyring>=25.6,<26; sys_platform == 'win32'"]
realtime = ["websockets>=17.1,<18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
