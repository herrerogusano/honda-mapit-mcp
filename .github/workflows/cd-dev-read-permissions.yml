name: Retained dev read-only GitHub permissions

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/cd-dev-read-permissions.yml
      - scripts/probe_github_dev_read_permissions.py

permissions: {}

concurrency:
  group: honda-mapit-retained-dev-read-permissions
  cancel-in-progress: false

jobs:
  read-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact develop source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Read only protection metadata and emit booleans
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.probe_github_dev_read_permissions
