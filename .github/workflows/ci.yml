name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Reject MAPIT credentials in the job environment
        shell: bash
        run: |
          if env | awk -F= '$1 == "MAPIT_EMAIL" || $1 == "MAPIT_PASSWORD" { found=1 } END { exit found ? 0 : 1 }'; then
            echo "MAPIT credentials must not be present in CI"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check ".[test]"

      - name: Compile
        run: python -m compileall -q src tests scripts

      - name: Test
        run: python -m pytest -q

